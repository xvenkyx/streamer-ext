<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 270px;
      padding: 18px;
      font-family: sans-serif;
      background: #1e1e1e;
      color: #fff;
    }

    h3 { font-size: 13px; color: #aaa; margin-bottom: 14px; }

    input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
      outline: none;
      margin-bottom: 10px;
    }
    input[type="password"]:focus { border-color: #666; }

    button.primary {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      background: #4285f4;
      color: #fff;
      cursor: pointer;
    }
    button.primary:hover { background: #3367d6; }

    #status { margin-top: 10px; font-size: 12px; text-align: center; }
    #status.ok  { color: #4caf50; }
    #status.err { color: #f44336; }

    .divider {
      border: none;
      border-top: 1px solid #333;
      margin: 16px 0;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .toggle-label {
      font-size: 13px;
      color: #ccc;
    }
    .toggle-sublabel {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    /* Toggle switch */
    .switch {
      position: relative;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #4285f4; }
    input:checked + .slider::before { transform: translateX(16px); }

    #relay-status {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 6px;
    }
    #relay-status.ok  { color: #4caf50; }
    #relay-status.err { color: #f44336; }
  </style>
</head>
<body>
  <h3 id="title">Enter password to activate</h3>
  <input id="pwd" type="password" placeholder="Password" />
  <button class="primary" onclick="submit()">Unlock</button>
  <div id="status"></div>

  <hr class="divider" id="settings-divider" style="display:none">

  <div id="settings" style="display:none">
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Live Streaming</div>
        <div class="toggle-sublabel">Auto-sends AI responses to client</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="streaming-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div id="relay-status">Relay: checking…</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
